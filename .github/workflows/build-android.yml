name: Ghost Town Recomp Android Build and Tester Release

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe-tests:
    name: Game installation probe tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run probe unit tests
        run: python -m unittest discover -s tools/tests -v

  android-build:
    name: Build Android ARM64 APK
    runs-on: ubuntu-latest
    needs: probe-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;26.3.11579264 cmake;3.22.1'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Configure and build native ARM64 library
        run: |
          $ANDROID_HOME/cmake/3.22.1/bin/cmake \
            -S android/native \
            -B build-native-arm64 \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_HOME/ndk/26.3.11579264/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DANDROID_STL=c++_static \
            -DCMAKE_SHARED_LINKER_FLAGS="-Wl,-z,max-page-size=16384" \
            -DCMAKE_BUILD_TYPE=Release
          $ANDROID_HOME/cmake/3.22.1/bin/cmake --build build-native-arm64 -j$(nproc)
      - name: Build debug and release APK
        working-directory: android
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace
      - name: Run Android lint
        working-directory: android
        run: gradle lint --no-daemon --stacktrace
      - name: Upload APKs and native library
        uses: actions/upload-artifact@v4
        with:
          name: ghost-town-recomp-0.3.3-arm64
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            build-native-arm64/**/*.so
          if-no-files-found: error
      - name: Publish v0.3.2 tester pre-release
        if: github.event_name == 'push' && contains(github.event.head_commit.message, 'release-v0.3.3')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.3
          target_commitish: main
          name: Ghost Town Recomp 0.3.3 - Contributor Tester Candidate
          prerelease: true
          body: |
            See CHANGELOG.md, docs/CONTRIBUTOR_TESTING.md, and runtime/ANDROID_RUNTIME_LAYOUT.md.
            Includes app-private Wine runtime bundle import with path-safety checks and runtime payload checksum validation.
            Runtime bundle is a separate Actions artifact and is not embedded in the APK.
            Does not bundle proprietary Unity Player/game files. Wine/Box64/DXVK and Vulkan gameplay compatibility remain unverified on physical Android hardware.
          files: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            build-native-arm64/**/*.so
          generate_release_notes: true

  runtime-components:
    name: Package verified Wine and DXVK components
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install archive tools
        run: sudo apt-get update && sudo apt-get install -y curl xz-utils tar file
      - name: Download pinned upstream releases
        run: |
          set -euo pipefail
          mkdir -p downloads bundle/wine bundle/dxvk
          curl -fL --retry 3 https://github.com/Kron4ek/Wine-Builds/releases/download/11.19/wine-11.19-amd64.tar.xz -o downloads/wine.tar.xz
          curl -fL --retry 3 https://github.com/doitsujin/DXVK/releases/download/v3.1.1/dxvk-3.1.1.tar.gz -o downloads/dxvk.tar.gz
      - name: Verify SHA-256 and extract components
        run: |
          set -euo pipefail
          echo "40068b3825887224d4b95364e3f49342d4bf7efac5486614b8bc4e7173bbef3e  downloads/wine.tar.xz" | sha256sum -c -
          echo "40565b4a724aadc4433fa4e010b4b23916d9b1f1baeee64e17186db94f54e608  downloads/dxvk.tar.gz" | sha256sum -c -
          tar -xJf downloads/wine.tar.xz -C bundle/wine --strip-components=1
          tar -xzf downloads/dxvk.tar.gz -C bundle/dxvk --strip-components=1
          WINE_BIN="$(find bundle/wine -type f -path '*/bin/wine' -print -quit)"
          test -n "$WINE_BIN"
          test -d bundle/dxvk/x64
          test -d bundle/dxvk/x32
          mkdir -p bundle/provenance
          sha256sum downloads/* > bundle/provenance/SHA256SUMS
          printf 'Wine=11.19 amd64\\nDXVK=3.1.1\\nWine target=Linux x86_64; requires Box64 + ARM64 glibc userspace\\nDXVK target=Windows DLLs for Wine prefix; requires Vulkan bridge\\n' > bundle/provenance/COMPONENTS.txt
          cp docs/runtime-bundle-README.md bundle/README.md
      - name: Upload Wine and DXVK contributor bundle
        uses: actions/upload-artifact@v4
        with:
          name: ghost-town-wine-11.19-dxvk-3.1.1
          path: bundle/
          if-no-files-found: error
          retention-days: 30
