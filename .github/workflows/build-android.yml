name: Ghost Town Recomp Android APK Build and Size Audit

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'android/**'
      - 'runtime/manifest.json'
      - 'tools/**'
      - '.github/workflows/build-android.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'android/**'
      - 'runtime/manifest.json'
      - 'tools/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe-tests:
    name: Game installation probe tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python tools and runtime manifest
        run: |
          python -m json.tool runtime/manifest.json >/dev/null
          python -m py_compile tools/audit_apk_size.py tools/validate_runtime_archive.py tools/audit_runtime_tree.py tools/ingest_feasibility.py
          bash -n runtime/scripts/ci-wine-smoke.sh
          bash -n tools/build-report.sh
      - name: Run probe unit tests
        run: python -m unittest discover -s tools/tests -v

  android-build:
    name: Build Android ARM64 APK
    runs-on: ubuntu-latest
    needs: probe-tests
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Initialize required native source submodules
        run: |
          git submodule update --init --recursive external/libadrenotools
          git submodule update --init external/winlatorxr
      - name: Install Windows cross-compiler
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64-posix
      - name: Build standalone Windows D3D11 smoke test
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/assets/tests
          x86_64-w64-mingw32-g++ -std=c++17 -O2 -static -static-libgcc -static-libstdc++ \
            tools/d3d11_smoke/d3d11_smoke.cpp \
            -o android/app/src/main/assets/tests/d3d11-smoke.exe \
            -ld3d11 -ldxgi -luser32
          file android/app/src/main/assets/tests/d3d11-smoke.exe
          test -s android/app/src/main/assets/tests/d3d11-smoke.exe
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;26.3.11579264 ndk;28.2.13676358 cmake;3.22.1'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Configure and build native ARM64 library
        run: |
          $ANDROID_HOME/cmake/3.22.1/bin/cmake \
            -S android/native \
            -B build-native-arm64 \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_HOME/ndk/26.3.11579264/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DANDROID_STL=c++_static \
            -DCMAKE_SHARED_LINKER_FLAGS="-Wl,-z,max-page-size=16384" \
            -DCMAKE_BUILD_TYPE=Release
          $ANDROID_HOME/cmake/3.22.1/bin/cmake --build build-native-arm64 -j$(nproc)
          VIRGL_SO="$(find build-native-arm64 -type f -name 'libvirglrenderer.so' -print -quit)"
          test -n "$VIRGL_SO"
          echo "VirGL host renderer built: $VIRGL_SO"
          WINLATOR_SO="$(find build-native-arm64 -type f -name 'libwinlator.so' -print -quit)"
          test -n "$WINLATOR_SO"
          echo "Winlator X11 JNI bridge built: $WINLATOR_SO"
      - name: Build static Android PRoot into APK native libraries (W^X-safe)
        run: |
          set -euo pipefail
          git clone https://github.com/berilevi/proot-static.git proot-src
          git -C proot-src checkout --detach 6f8ebfd8e24887dfba64c3f2d7d5fe9dc059b60e
          git -C proot-src rev-parse HEAD > proot-upstream-commit.txt
          cd proot-src
          NDK="$ANDROID_HOME/ndk/28.2.13676358" \
          OUT="$RUNNER_TEMP/proot-static-build" \
          REPO_ARTIFACT_DIR="$GITHUB_WORKSPACE/proot-src/dist/aarch64" \
            tools/build-static-aarch64.sh
          cd "$GITHUB_WORKSPACE"
          DEST="android/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$DEST" android/app/src/main/assets/licenses
          install -m 0755 proot-src/dist/aarch64/proot "$DEST/libproot.so"
          install -m 0755 proot-src/dist/aarch64/loader "$DEST/libproot-loader.so"
          install -m 0644 proot-src/COPYING android/app/src/main/assets/licenses/PROOT-COPYING
          for f in "$DEST/libproot.so" "$DEST/libproot-loader.so"; do
            readelf -h "$f" | grep -q 'Class:.*ELF64'
            readelf -h "$f" | grep -q 'Machine:.*AArch64'
            if readelf -l "$f" | grep -q 'Requesting program interpreter'; then
              echo "PRoot must be statically linked: $f" >&2
              exit 1
            fi
          done
          sha256sum "$DEST"/*.so | tee proot-native-sha256.txt

      - name: Build debug and release APK
        working-directory: android
        run: gradle testDebugUnitTest assembleDebug assembleRelease --no-daemon --stacktrace
      - name: Run Android lint
        working-directory: android
        run: gradle lint --no-daemon --stacktrace
      - name: Audit APK contents and record package sizes
        run: |
          set -euo pipefail
          mkdir -p size-audit
          for apk in android/app/build/outputs/apk/debug/*.apk android/app/build/outputs/apk/release/*.apk; do
            [ -f "$apk" ] || continue
            python3 tools/audit_apk_size.py "$apk" | tee "size-audit/$(basename "$apk").txt"
            sha256sum "$apk" | tee -a "size-audit/$(basename "$apk").txt"
          done
          test -s size-audit/app-release.apk.txt
      - name: Upload APK size audit
        uses: actions/upload-artifact@v4
        with:
          name: apk-size-audit
          path: size-audit/
          if-no-files-found: error
      - name: Upload APKs and native library
        uses: actions/upload-artifact@v4
        with:
          name: ghost-town-recomp-0.5.0-alpha.2-arm64
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            build-native-arm64/**/*.so
            proot-native-sha256.txt
            proot-upstream-commit.txt
            android/app/src/main/assets/licenses/PROOT-COPYING
          if-no-files-found: error


  build-report:
    name: Build report (always)
    if: always()
    needs: [probe-tests, android-build]
    uses: ./.github/workflows/build-report.yml
    with:
      workflow_name: ${{ github.workflow }}
      job_results: ${{ toJSON(needs) }}
