name: Build Ghost Town Recomp Android NDK & APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Compile C++20 NDK (arm64-v8a) & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK r26d
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;26.3.11579264 cmake;3.22.1'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Verify Native CMake Configuration (arm64-v8a)
        run: |
          $ANDROID_HOME/cmake/3.22.1/bin/cmake \
            -S android/native \
            -B build-native-arm64 \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_HOME/ndk/26.3.11579264/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DANDROID_STL=c++_static \
            -DCMAKE_SHARED_LINKER_FLAGS="-Wl,-z,max-page-size=16384" \
            -DCMAKE_BUILD_TYPE=Release
          $ANDROID_HOME/cmake/3.22.1/bin/cmake --build build-native-arm64 -j$(nproc)

      - name: Build Release and Debug APK via Gradle
        working-directory: ./android
        run: gradle assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Run Android lint
        working-directory: ./android
        run: gradle lint --no-daemon --stacktrace

      - name: Upload Built APKs & Native Symbols
        uses: actions/upload-artifact@v4
        with:
          name: ghost-town-recomp-arm64-apks
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
            build-native-arm64/**/*.so
            android/app/build/intermediates/cxx/Debug/**/obj/arm64-v8a/*.so
          if-no-files-found: warn

      - name: Publish Ghost Town Recomp v0.3.0 Pre-Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release-v0.3.0]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.0
          target_commitish: main
          name: "Ghost Town Recomp 0.3.0 (Experimental Runtime Preview)"
          prerelease: true
          body: |
            See CHANGELOG.md. This release improves runtime truthfulness and Android packaging.
            Game data detection is not gameplay support. Unity Player execution is not yet integrated.
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
            build-native-arm64/**/*.so
          generate_release_notes: true
