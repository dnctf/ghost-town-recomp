name: Ghost Town Recomp Android Build and v0.5.0 Alpha Release

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe-tests:
    name: Game installation probe tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run probe unit tests
        run: python -m unittest discover -s tools/tests -v

  android-build:
    name: Build Android ARM64 APK
    runs-on: ubuntu-latest
    needs: probe-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Initialize required native source submodules
        run: |
          git submodule update --init --recursive external/libadrenotools
          git submodule update --init external/winlatorxr
      - name: Install Windows cross-compiler
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64-posix
      - name: Build standalone Windows D3D11 smoke test
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/assets/tests
          x86_64-w64-mingw32-g++ -std=c++17 -O2 -static -static-libgcc -static-libstdc++ \
            tools/d3d11_smoke/d3d11_smoke.cpp \
            -o android/app/src/main/assets/tests/d3d11-smoke.exe \
            -ld3d11 -ldxgi -luser32
          file android/app/src/main/assets/tests/d3d11-smoke.exe
          test -s android/app/src/main/assets/tests/d3d11-smoke.exe
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;26.3.11579264 cmake;3.22.1'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Configure and build native ARM64 library
        run: |
          $ANDROID_HOME/cmake/3.22.1/bin/cmake \
            -S android/native \
            -B build-native-arm64 \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_HOME/ndk/26.3.11579264/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DANDROID_STL=c++_static \
            -DCMAKE_SHARED_LINKER_FLAGS="-Wl,-z,max-page-size=16384" \
            -DCMAKE_BUILD_TYPE=Release
          $ANDROID_HOME/cmake/3.22.1/bin/cmake --build build-native-arm64 -j$(nproc)
          VIRGL_SO="$(find build-native-arm64 -type f -name 'libvirglrenderer.so' -print -quit)"
          test -n "$VIRGL_SO"
          echo "VirGL host renderer built: $VIRGL_SO"
          WINLATOR_SO="$(find build-native-arm64 -type f -name 'libwinlator.so' -print -quit)"
          test -n "$WINLATOR_SO"
          echo "Winlator X11 JNI bridge built: $WINLATOR_SO"
      - name: Embed verified runtime bundle into APK assets
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/assets/runtime/parts
          BASE="https://github.com/dnctf/ghost-town-recomp/releases/download/v0.4.0-alpha.1"
          curl -fL --retry 5 --retry-all-errors "$BASE/ghost-town-wine-runtime-arm64.tar.gz" -o "$RUNNER_TEMP/runtime.tar.gz"
          curl -fL --retry 5 --retry-all-errors "$BASE/ghost-town-wine-runtime-arm64.tar.gz.sha256" -o "$RUNNER_TEMP/runtime.sha256"
          EXPECTED="$(awk '{print $1}' "$RUNNER_TEMP/runtime.sha256")"
          echo "$EXPECTED  $RUNNER_TEMP/runtime.tar.gz" | sha256sum -c -
          test "$(stat -c%s "$RUNNER_TEMP/runtime.tar.gz")" -gt 100000000
          python3 tools/validate_runtime_archive.py "$RUNNER_TEMP/runtime.tar.gz"
          split -b 64m -d -a 4 "$RUNNER_TEMP/runtime.tar.gz" android/app/src/main/assets/runtime/parts/runtime-
          for part in android/app/src/main/assets/runtime/parts/runtime-[0-9][0-9][0-9][0-9]; do
            mv "$part" "$part.bin"
          done
          (cd android/app/src/main/assets/runtime/parts && sha256sum runtime-*.bin > SHA256SUMS)
          test -s android/app/src/main/assets/runtime/parts/SHA256SUMS
          test "$(find android/app/src/main/assets/runtime/parts -maxdepth 1 -type f -name 'runtime-*.bin' | wc -l)" -gt 0

      - name: Build debug and release APK
        working-directory: android
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace
      - name: Run Android lint
        working-directory: android
        run: gradle lint --no-daemon --stacktrace
      - name: Audit APK contents and record package sizes
        run: |
          set -euo pipefail
          mkdir -p size-audit
          for apk in android/app/build/outputs/apk/debug/*.apk android/app/build/outputs/apk/release/*.apk; do
            [ -f "$apk" ] || continue
            python3 tools/audit_apk_size.py "$apk" | tee "size-audit/$(basename "$apk").txt"
          done
          test -s size-audit/app-release.apk.txt
      - name: Upload APK size audit
        uses: actions/upload-artifact@v4
        with:
          name: apk-size-audit
          path: size-audit/
          if-no-files-found: error
      - name: Upload APKs and native library
        uses: actions/upload-artifact@v4
        with:
          name: ghost-town-recomp-0.5.0-alpha.1-arm64
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            build-native-arm64/**/*.so
          if-no-files-found: error
      - name: Publish v0.4.0-alpha.1 tester pre-release
        if: github.event_name == 'push' && contains(github.event.head_commit.message, 'release-v0.5.0-alpha.1')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.0-alpha.1
          target_commitish: main
          name: Ghost Town Recomp 0.5.0-alpha.1 - Bundled Runtime Repair
          prerelease: true
          body: |
            See CHANGELOG.md, docs/CONTRIBUTOR_TESTING.md, docs/V0.4.0_EXECUTION_GATES.md, and docs/PROVENANCE.md.
            Alpha foundation release: APK bundles the Wine/Box64 runtime archive and provisions it automatically on first launch. Runtime extraction now handles repeated hardlink entries and safely rebases absolute symlinks that remain inside the private staging root. The normal UI uses only the bundled runtime and offers an install/repair action; no manual runtime archive picker or runtime download is required.
            Includes ARM64 PRoot, Debian Bookworm ARM64/amd64 rootfs, Box64 ARM64, Wine 11.19 amd64, and DXVK 3.1.1 in the managed runtime archive.
            This is NOT a playable Overcooked 2 release. Turnip/libadrenotools, glibc-visible Vulkan WSI/presentation, Wine process launcher, audio/input bridge, and physical MatePad gameplay evidence remain incomplete.
            Does not include proprietary game binaries or user game assets.
          files: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            build-native-arm64/**/*.so
          generate_release_notes: true

  runtime-components:
    name: Package verified Wine and DXVK components
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install archive tools
        run: sudo apt-get update && sudo apt-get install -y curl xz-utils tar file zstd
      - name: Download pinned upstream releases
        run: |
          set -euo pipefail
          mkdir -p downloads bundle/wine bundle/dxvk
          curl -fL --retry 3 https://github.com/Kron4ek/Wine-Builds/releases/download/11.19/wine-11.19-amd64.tar.xz -o downloads/wine.tar.xz
          curl -fL --retry 3 https://github.com/doitsujin/DXVK/releases/download/v3.1.1/dxvk-3.1.1.tar.gz -o downloads/dxvk.tar.gz
      - name: Verify SHA-256 and extract components
        run: |
          set -euo pipefail
          echo "40068b3825887224d4b95364e3f49342d4bf7efac5486614b8bc4e7173bbef3e  downloads/wine.tar.xz" | sha256sum -c -
          echo "40565b4a724aadc4433fa4e010b4b23916d9b1f1baeee64e17186db94f54e608  downloads/dxvk.tar.gz" | sha256sum -c -
          tar -xJf downloads/wine.tar.xz -C bundle/wine --strip-components=1
          tar -xzf downloads/dxvk.tar.gz -C bundle/dxvk --strip-components=1
          WINE_BIN="$(find bundle/wine -type f -path '*/bin/wine' -print -quit)"
          test -n "$WINE_BIN"
          test -d bundle/dxvk/x64
          test -d bundle/dxvk/x32
          mkdir -p bundle/provenance
          sha256sum downloads/* > bundle/provenance/SHA256SUMS
          printf 'Wine=11.19 amd64\\nDXVK=3.1.1\\nWine target=Linux x86_64; requires Box64 + ARM64 glibc userspace\\nDXVK target=Windows DLLs for Wine prefix; requires Vulkan bridge\\n' > bundle/provenance/COMPONENTS.txt
          cp docs/runtime-bundle-README.md bundle/README.md
      - name: Upload Wine and DXVK contributor bundle
        uses: actions/upload-artifact@v4
        with:
          name: ghost-town-wine-11.19-dxvk-3.1.1
          path: bundle/
          if-no-files-found: error
          retention-days: 30
