name: Build overcooked-recomp Android NDK & APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Compile C++20 NDK (arm64-v8a) & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK r26d
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;26.3.11579264 cmake;3.22.1'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Verify Native CMake Configuration (arm64-v8a)
        run: |
          $ANDROID_HOME/cmake/3.22.1/bin/cmake \
            -S android/native \
            -B build-native-arm64 \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_HOME/ndk/26.3.11579264/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release
          $ANDROID_HOME/cmake/3.22.1/bin/cmake --build build-native-arm64 -j$(nproc)

      - name: Build Debug APK via Gradle
        working-directory: ./android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Built APK & Native Symbols
        uses: actions/upload-artifact@v4
        with:
          name: overcooked-recomp-arm64-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk
            build-native-arm64/**/*.so
            android/app/build/intermediates/cxx/Debug/**/obj/arm64-v8a/*.so
          if-no-files-found: warn
