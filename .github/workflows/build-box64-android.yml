name: Build Box64 Android ARM64 (experimental)

on:
  push:
    branches: [main]
    paths:
      - 'runtime/box64/**'
      - 'runtime/manifest.json'
      - 'docs/BOX64_ANDROID_RUNTIME.md'
      - '.github/workflows/build-box64-android.yml'
  workflow_dispatch:
    inputs:
      box64_ref:
        description: Box64 branch, tag, or commit to build
        required: true
        default: main
        type: string
      target:
        description: Android target profile
        required: true
        default: sd888
        type: choice
        options:
          - sd888
          - generic-arm64

permissions:
  contents: read

jobs:
  build-box64:
    name: Build Box64 for Android Bionic ARM64
    runs-on: ubuntu-24.04
    steps:
      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git cmake ninja-build python3 file binutils

      - name: Set up Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;26.3.11579264'

      - name: Checkout Box64 upstream source
        env:
          BOX64_REF: ${{ inputs.box64_ref }}
        run: |
          git clone https://github.com/ptitSeb/box64.git box64-src
          git -C box64-src checkout --detach "$BOX64_REF"
          git -C box64-src rev-parse HEAD | tee box64-upstream-commit.txt
          git -C box64-src status --short

      - name: Configure Android Bionic ARM64 build
        env:
          TARGET_PROFILE: ${{ inputs.target }}
        run: |
          NDK="$ANDROID_HOME/ndk/26.3.11579264"
          TOOLCHAIN="$NDK/build/cmake/android.toolchain.cmake"
          PROFILE_ARGS=()
          if [ "$TARGET_PROFILE" = "sd888" ]; then
            PROFILE_ARGS+=("-DSD888=ON")
          else
            PROFILE_ARGS+=("-DARM64=ON")
          fi
          cmake -S box64-src -B box64-build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DANDROID=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/box64-install" \
            -DNO_LIB_INSTALL=ON \
            -DNO_CONF_INSTALL=ON \
            "${PROFILE_ARGS[@]}"

      - name: Compile and stage Box64
        run: |
          cmake --build box64-build --parallel 2
          cmake --install box64-build
          mkdir -p dist
          find box64-build box64-install -type f -name 'box64' -perm -111 -print -exec cp {} dist/box64 ;
          test -s dist/box64
          file dist/box64
          readelf -h dist/box64 | tee dist/elf-header.txt
          readelf -h dist/box64 | grep -q 'AArch64'
          cp box64-upstream-commit.txt dist/
          printf 'target=%s\nabi=arm64-v8a\nplatform=Android Bionic\n' "${{ inputs.target }}" > dist/build-info.txt

      - name: Upload experimental Box64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: box64-android-arm64-${{ inputs.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
