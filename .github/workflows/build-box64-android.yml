name: Build Box64 Linux ARM64 (glibc)

on:
  workflow_dispatch:
    inputs:
      box64_ref:
        description: Upstream Box64 branch, tag, or commit
        required: true
        default: 7fab05334445948c918281b54f2a604ff63337f7
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-box64:
    name: Build Box64 Linux ARM64 for glibc userspace
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git cmake ninja-build build-essential file binutils libcapstone-dev

      - name: Checkout Box64 upstream
        env:
          BOX64_REF: ${{ inputs.box64_ref || 'main' }}
        run: |
          git clone https://github.com/ptitSeb/box64.git box64-src
          git -C box64-src checkout --detach "$BOX64_REF"
          git -C box64-src rev-parse HEAD | tee box64-upstream-commit.txt

      - name: Configure Linux ARM64 glibc build
        run: |
          cmake -S box64-src -B box64-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/box64-install" \
            -DSD888=ON \
            -DARM_DYNAREC=ON \
            -DNO_LIB_INSTALL=ON \
            -DNO_CONF_INSTALL=ON

      - name: Compile and validate Box64
        run: |
          cmake --build box64-build --parallel 2
          cmake --install box64-build
          mkdir -p dist
          find box64-build box64-install -type f -name box64 -perm -111 -print -exec cp {} dist/box64 \;
          test -s dist/box64
          file dist/box64 | tee dist/file.txt
          readelf -h dist/box64 | tee dist/elf-header.txt
          readelf -h dist/box64 | grep -q 'AArch64'
          ldd dist/box64 | tee dist/ldd.txt
          cp box64-upstream-commit.txt dist/
          printf 'abi=aarch64-linux-gnu\nprofile=Snapdragon 888\nuserspace=glibc\n' > dist/build-info.txt

      - name: Upload Box64 Linux ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: box64-linux-arm64-glibc-sd888
          path: dist/*
          if-no-files-found: error
          retention-days: 30
