name: Reusable build report
on:
  workflow_call:
    inputs:
      workflow_name:
        required: true
        type: string
      job_results:
        required: true
        type: string
permissions:
  actions: read
  contents: read
jobs:
  report:
    name: Generate always-on build report
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact build commit
        uses: actions/checkout@v4
      - name: Download available artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
        continue-on-error: true
      - name: Generate quote-box report
        env:
          REPORT_WORKFLOW: ${{ inputs.workflow_name }}
          REPORT_JOB_RESULTS: ${{ inputs.job_results }}
          REPORT_ARTIFACT_DIR: artifacts
          REPORT_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          mkdir -p reports
          bash tools/build-report.sh reports
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-report-${{ github.workflow }}-${{ github.run_number }}
          path: reports/
          if-no-files-found: error
          retention-days: 30
