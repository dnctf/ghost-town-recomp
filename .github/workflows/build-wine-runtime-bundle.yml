name: Build Complete ARM64 Wine Runtime Bundle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-wine-runtime-bundle.yml'
      - 'runtime/manifest.json'
      - 'runtime/rootfs/**'
  workflow_dispatch:
    inputs:
      debian_suite:
        description: Debian suite for the ARM64 glibc rootfs
        required: true
        default: bookworm
        type: choice
        options: [bookworm]
      box64_ref:
        description: Box64 upstream ref
        required: true
        default: main
        type: string
      proot_ref:
        description: Android PRoot upstream ref
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  build-runtime:
    name: Assemble ARM64 glibc + Box64 + Wine + DXVK + Android PRoot
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      DEBIAN_SUITE: ${{ inputs.debian_suite || 'bookworm' }}
      BOX64_REF: ${{ inputs.box64_ref || 'main' }}
      PROOT_REF: ${{ inputs.proot_ref || 'main' }}
      WINE_SHA256: 40068b3825887224d4b95364e3f49342d4bf7efac5486614b8bc4e7173bbef3e
      DXVK_SHA256: 40565b4a724aadc4433fa4e010b4b23916d9b1f1baeee64e17186db94f54e608
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install host build tools and Android NDK
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap schroot qemu-user-static             git cmake ninja-build build-essential file binutils             libcapstone-dev curl xz-utils tar zstd python3 pax-utils
      - name: Set up Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;28.2.13676358'

      - name: Build Box64 for ARM64 glibc
        run: |
          set -euo pipefail
          git clone https://github.com/ptitSeb/box64.git box64-src
          git -C box64-src checkout --detach "$BOX64_REF"
          git -C box64-src rev-parse HEAD > box64-upstream-commit.txt
          cmake -S box64-src -B box64-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DSD888=ON \
            -DARM_DYNAREC=ON \
            -DNO_LIB_INSTALL=ON \
            -DNO_CONF_INSTALL=ON
          cmake --build box64-build --parallel 2
          find box64-build -type f -name box64 -perm -111 -print -quit | grep .
          install -D -m 0755 "$(find box64-build -type f -name box64 -perm -111 -print -quit)" box64-install/usr/local/bin/box64
          file box64-install/usr/local/bin/box64
          readelf -h box64-install/usr/local/bin/box64 | grep -q AArch64
          ldd box64-install/usr/local/bin/box64 | tee box64-ldd.txt

      - name: Build static Android ARM64 PRoot
        run: |
          set -euo pipefail
          git clone https://github.com/berilevi/proot-static.git proot-src
          git -C proot-src checkout --detach "$PROOT_REF"
          git -C proot-src rev-parse HEAD > proot-upstream-commit.txt
          cd proot-src
          NDK="$ANDROID_HOME/ndk/28.2.13676358" \
          OUT="$RUNNER_TEMP/proot-static-build" \
          REPO_ARTIFACT_DIR="$GITHUB_WORKSPACE/proot-src/dist/aarch64" \
            tools/build-static-aarch64.sh
          cd "$GITHUB_WORKSPACE"
          test -s proot-src/dist/aarch64/proot
          test -s proot-src/dist/aarch64/loader
          test -s proot-src/dist/aarch64/loader32
          for f in proot-src/dist/aarch64/proot proot-src/dist/aarch64/loader proot-src/dist/aarch64/loader32; do
            readelf -h "$f" | grep -q AArch64
          done

      - name: Download and verify pinned Wine and DXVK
        run: |
          set -euo pipefail
          mkdir -p downloads
          curl -fL --retry 3 https://github.com/Kron4ek/Wine-Builds/releases/download/11.19/wine-11.19-amd64.tar.xz -o downloads/wine.tar.xz
          curl -fL --retry 3 https://github.com/doitsujin/DXVK/releases/download/v3.1.1/dxvk-3.1.1.tar.gz -o downloads/dxvk.tar.gz
          echo "$WINE_SHA256  downloads/wine.tar.xz" | sha256sum -c -
          echo "$DXVK_SHA256  downloads/dxvk.tar.gz" | sha256sum -c -

      - name: Bootstrap Debian ARM64 glibc rootfs and amd64 Wine libraries
        run: |
          set -euo pipefail
          ROOTFS="$GITHUB_WORKSPACE/runtime-bundle/rootfs"
          mkdir -p "$ROOTFS"
          sudo debootstrap --arch=arm64 --variant=minbase \
            --include=ca-certificates,locales,libstdc++6,libgcc-s1,libcapstone4 \
            "$DEBIAN_SUITE" "$ROOTFS" https://deb.debian.org/debian
          sudo cp /etc/resolv.conf "$ROOTFS/etc/resolv.conf"
          sudo chroot "$ROOTFS" /usr/bin/dpkg --add-architecture amd64
          sudo chroot "$ROOTFS" /usr/bin/apt-get update
          sudo chroot "$ROOTFS" /usr/bin/apt-get install -y --no-install-recommends \
            libc6:amd64 libgcc-s1:amd64 libstdc++6:amd64 zlib1g:amd64 \
            libasound2:amd64 libpulse0:amd64 libdbus-1-3:amd64 \
            libfreetype6:amd64 libfontconfig1:amd64 libgnutls30:amd64 \
            libx11-6:amd64 libxext6:amd64 libxrender1:amd64 libxrandr2:amd64 \
            libxi6:amd64 libxcursor1:amd64 libxinerama1:amd64 \
            libxcomposite1:amd64 libxdamage1:amd64 libxfixes3:amd64 \
            libxkbcommon0:amd64 libxss1:amd64 libxtst6:amd64 \
            libxinerama1:amd64 libxmu6:amd64 libxpm4:amd64 \
            libwayland-client0:amd64 libwayland-egl1:amd64 \
            libvulkan1:amd64 libgl1:amd64 libegl1:amd64 libgbm1:amd64 \
            libunwind8:amd64 libatomic1:amd64 libglib2.0-0:amd64 \
            libgstreamer1.0-0:amd64 libgstreamer-plugins-base1.0-0:amd64 \
            libkrb5-3:amd64 libldap-2.5-0:amd64
          sudo install -D -m 0755 box64-install/usr/local/bin/box64 "$ROOTFS/usr/local/bin/box64"

      - name: Install Wine and DXVK payload into rootfs
        run: |
          set -euo pipefail
          ROOTFS="$GITHUB_WORKSPACE/runtime-bundle/rootfs"
          mkdir -p wine-extract dxvk-extract "$ROOTFS/opt/wine" "$ROOTFS/opt/dxvk"
          tar -xJf downloads/wine.tar.xz -C wine-extract --strip-components=1
          WINE_ROOT="$(find wine-extract -type f -path '*/bin/wine' -print -quit)"
          test -n "$WINE_ROOT"
          WINE_DIR="$(dirname "$(dirname "$WINE_ROOT")")"
          cp -a "$WINE_DIR/." "$ROOTFS/opt/wine/"
          tar -xzf downloads/dxvk.tar.gz -C dxvk-extract --strip-components=1
          test -d dxvk-extract/x64
          test -d dxvk-extract/x32
          cp -a dxvk-extract/. "$ROOTFS/opt/dxvk/"
          test -x "$ROOTFS/opt/wine/bin/wine"
          test -x "$ROOTFS/usr/local/bin/box64"
          test -s "$ROOTFS/opt/dxvk/x64/d3d11.dll"
          test -s "$ROOTFS/opt/dxvk/x64/dxgi.dll"
          set +e
          sudo lddtree -R "$ROOTFS" /opt/wine/bin/wine | tee wine-lddtree.txt
          LDDTREE_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$LDDTREE_STATUS" -ne 0 ] || grep -Eq '=> None|could not locate library|not found' wine-lddtree.txt; then
            echo "Wine has unresolved x86_64 shared-library dependencies." >&2
            exit 1
          fi
          sudo chroot "$ROOTFS" /usr/bin/apt-get clean
          sudo rm -rf "$ROOTFS/var/lib/apt/lists/"* "$ROOTFS/usr/share/doc/"* "$ROOTFS/usr/share/man/"* "$ROOTFS/usr/share/locale/"*

      - name: Assemble app-private runtime bundle and provenance
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/runtime-bundle"
          mkdir -p "$OUT/bin" "$OUT/libexec/proot" "$OUT/provenance"
          install -m 0755 proot-src/dist/aarch64/proot "$OUT/bin/proot"
          install -m 0755 proot-src/dist/aarch64/loader "$OUT/libexec/proot/loader"
          install -m 0755 proot-src/dist/aarch64/loader32 "$OUT/libexec/proot/loader32"
          cp proot-src/COPYING "$OUT/provenance/PROOT-COPYING"
          cp box64-upstream-commit.txt proot-upstream-commit.txt "$OUT/provenance/"
          cp box64-ldd.txt wine-lddtree.txt "$OUT/provenance/"
          cp downloads/wine.tar.xz downloads/dxvk.tar.gz "$OUT/provenance/"
          printf 'debian_suite=%s\nrootfs_arch=arm64\nforeign_arch=amd64\nbox64_profile=Snapdragon 888\nwine=11.19-amd64\ndxvk=3.1.1\nproot_abi=arm64-v8a\n' "$DEBIAN_SUITE" > "$OUT/provenance/BUILD-INFO.txt"
          cp runtime/rootfs/README.md "$OUT/README.md"
          (cd "$OUT" && sha256sum bin/proot libexec/proot/loader libexec/proot/loader32 rootfs/usr/local/bin/box64 > provenance/SHA256SUMS)
          tar --numeric-owner --xattrs --acls -czf ghost-town-wine-runtime-arm64.tar.gz -C "$OUT" .
          sha256sum ghost-town-wine-runtime-arm64.tar.gz > ghost-town-wine-runtime-arm64.tar.gz.sha256
          du -h ghost-town-wine-runtime-arm64.tar.gz

      - name: Upload complete runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: ghost-town-wine-runtime-arm64-debian-${{ env.DEBIAN_SUITE }}
          path: |
            ghost-town-wine-runtime-arm64.tar.gz
            ghost-town-wine-runtime-arm64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
