name: Build Complete ARM64 Wine Runtime Bundle

on:
  push:
    branches: [main]
    paths:
      - 'runtime/**'
      - '!runtime/scripts/ci-wine-smoke.sh'
      - 'runtime/rootfs/packages-amd64.txt'
      - 'tools/audit_runtime_tree.py'
      - 'tools/validate_runtime_archive.py'
  workflow_dispatch:
    inputs:
      debian_suite:
        description: Debian suite for the ARM64 glibc rootfs
        required: true
        default: bookworm
        type: choice
        options: [bookworm]
      box64_ref:
        description: Box64 upstream ref
        required: true
        default: 7fab05334445948c918281b54f2a604ff63337f7
        type: string
      wineboot_timeout_seconds:
        description: Diagnostic wineboot timeout; choose 600 for the extended diagnostic run
        required: true
        default: '600'
        type: choice
        options: ['180', '600']

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-box64:
    name: Build Box64 against Debian Bookworm ARM64 glibc
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:bookworm
    defaults:
      run:
        shell: bash
    timeout-minutes: 60
    env:
      BOX64_REF: ${{ inputs.box64_ref || '7fab05334445948c918281b54f2a604ff63337f7' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Box64 Bookworm build tools
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          apt-get update
          apt-get install -y git cmake ninja-build build-essential libcapstone-dev ccache file binutils python3
      - name: Restore Box64 compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: box64-arm64-${{ env.BOX64_REF }}-sd888-dynarec-release-v2
          restore-keys: |
            box64-arm64-${{ env.BOX64_REF }}-sd888-dynarec-
      - name: Build pinned Box64
        run: |
          set -euo pipefail
          git clone https://github.com/ptitSeb/box64.git box64-src
          git -C box64-src checkout --detach "$BOX64_REF"
          git -C box64-src rev-parse HEAD > box64-upstream-commit.txt
          ccache --zero-stats || true
          cmake -S box64-src -B box64-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DSD888=ON -DARM_DYNAREC=ON -DNO_LIB_INSTALL=ON -DNO_CONF_INSTALL=ON
          cmake --build box64-build --parallel 2
          install -D -m 0755 "$(find box64-build -type f -name box64 -perm -111 -print -quit)" box64-install/usr/local/bin/box64
          file box64-install/usr/local/bin/box64
          readelf -h box64-install/usr/local/bin/box64 | grep -q 'Machine:.*AArch64'
          ldd --version | sed -n '1p' | tee box64-build-glibc.txt
          ldd box64-install/usr/local/bin/box64 | tee box64-ldd.txt
          objdump -T box64-install/usr/local/bin/box64 | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -3 | tee box64-glibc-symbols.txt
          BOX64_GLIBC_MAX="$(tail -n 1 box64-glibc-symbols.txt | sed 's/^GLIBC_//')"
          BUILD_GLIBC="$(ldd --version | sed -n '1p' | awk '{print $NF}')"
          dpkg --compare-versions "$BOX64_GLIBC_MAX" le "$BUILD_GLIBC"
          ccache --show-stats | tee box64-ccache-stats.txt
      - name: Upload reusable Box64 build artifact
        uses: actions/upload-artifact@v4
        with:
          name: box64-arm64-glibc-sd888
          path: |
            box64-install/
            box64-src/LICENSE
            box64-upstream-commit.txt
            box64-ldd.txt
            box64-build-glibc.txt
            box64-glibc-symbols.txt
            box64-ccache-stats.txt
          if-no-files-found: error
          retention-days: 7

  build-rootfs:
    name: Build ARM64 glibc rootfs and Windows runtime components
    runs-on: ubuntu-24.04-arm
    needs: build-box64
    timeout-minutes: 120
    env:
      DEBIAN_SUITE: ${{ inputs.debian_suite || 'bookworm' }}
      WINE_SHA256: 40068b3825887224d4b95364e3f49342d4bf7efac5486614b8bc4e7173bbef3e
      WINEBOOT_TIMEOUT_SECONDS: ${{ inputs.wineboot_timeout_seconds || '180' }}
      ROOTFS: ${{ github.workspace }}/rootfs-artifact/rootfs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download Bookworm-compatible Box64 artifact
        uses: actions/download-artifact@v4
        with:
          name: box64-arm64-glibc-sd888
          path: box64-artifact
      - name: Verify native ARM64 runner and record CPU
        run: |
          set -euo pipefail
          { echo "uname_m=$(uname -m)"; echo "nproc=$(nproc)"; echo "runner_arch=${RUNNER_ARCH:-unknown}"; echo "runner_os=${RUNNER_OS:-unknown}"; echo "### host glibc"; ldd --version | sed -n '1p'; echo "### lscpu"; lscpu | grep -E "^(Architecture|CPU|Model name|Vendor ID|Byte Order)" || true; echo "### cpuinfo"; grep -m 6 -E "^(processor|model name|CPU implementer|CPU part|Features)" /proc/cpuinfo; } | tee runner-arm64-environment.log
          test "$(uname -m)" = "aarch64"
          test "${RUNNER_ARCH}" = "ARM64"
      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap git cmake ninja-build build-essential \
            file binutils curl xz-utils tar python3 pax-utils
      - name: Restore Debian package archive cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/apt-cache
          key: debian-bookworm-amd64-${{ hashFiles('runtime/rootfs/packages-amd64.txt') }}-v1
      - name: Download and verify pinned Wine
        run: |
          set -euo pipefail
          mkdir -p downloads
          curl -fL --retry 3 https://github.com/Kron4ek/Wine-Builds/releases/download/11.19/wine-11.19-amd64.tar.xz -o downloads/wine.tar.xz
          echo "$WINE_SHA256  downloads/wine.tar.xz" | sha256sum -c -

      - name: Bootstrap ARM64 glibc rootfs
        run: |
          source runtime/scripts/ci-diagnostics.sh 01-bootstrap-rootfs
          mkdir -p "$ROOTFS"
          sudo debootstrap --arch=arm64 --variant=minbase \
            --include=ca-certificates,locales,libstdc++6,libgcc-s1,libcapstone4,usrmerge \
            "$DEBIAN_SUITE" "$ROOTFS" https://deb.debian.org/debian
          mkdir -p "$RUNNER_TEMP/apt-cache/archives/partial"
          sudo cp -a "$RUNNER_TEMP/apt-cache/archives/." "$ROOTFS/var/cache/apt/archives/" 2>/dev/null || true
          sudo cp /etc/resolv.conf "$ROOTFS/etc/resolv.conf"
          sudo chroot "$ROOTFS" /usr/bin/dpkg --add-architecture amd64
          sudo test -L "$ROOTFS/lib"
          test "$(sudo readlink "$ROOTFS/lib")" = "usr/lib"
          sudo test -e "$ROOTFS/lib/ld-linux-aarch64.so.1"
          {
            echo "usrmerge_pre_amd64_extraction=passed"
            echo "lib_target=$(sudo readlink "$ROOTFS/lib")"
            sudo ls -ld "$ROOTFS/lib" "$ROOTFS/lib/ld-linux-aarch64.so.1"
          } | tee rootfs-usrmerge-before-amd64.txt

      - name: Download Debian amd64 runtime packages
        run: |
          source runtime/scripts/ci-diagnostics.sh 02-download-debian-packages
          sudo chroot "$ROOTFS" /usr/bin/apt-get -o Dpkg::Use-Pty=0 update
          PACKAGES="$(grep -Ev '^[[:space:]]*(#|$)' runtime/rootfs/packages-amd64.txt | tr '\n' ' ')"
          sudo chroot "$ROOTFS" /usr/bin/apt-get -o Dpkg::Use-Pty=0 --download-only install -y --no-install-recommends $PACKAGES 2>&1 | tee -a logs/apt-get-download.log

      - name: Extract Debian package payloads and pinned Wine
        run: |
          source runtime/scripts/ci-diagnostics.sh 03-extract-runtime-payloads
          : > rootfs-package-manifest-amd64.txt
          EXTRACT_TMP="$RUNNER_TEMP/amd64-package-extract"
          sudo rm -rf "$EXTRACT_TMP"
          sudo mkdir -p "$EXTRACT_TMP"
          for deb in "$ROOTFS"/var/cache/apt/archives/*.deb; do
            [ -f "$deb" ] || continue
            architecture="$(dpkg-deb -f "$deb" Architecture)"
            if [ "$architecture" = "amd64" ] || [ "$architecture" = "all" ]; then
              package="$(dpkg-deb -f "$deb" Package)"
              version="$(dpkg-deb -f "$deb" Version)"
              printf '%s:%s=%s\n' "$package" "$architecture" "$version" >> rootfs-package-manifest-amd64.txt
              sudo rm -rf "$EXTRACT_TMP"
              sudo mkdir -p "$EXTRACT_TMP"
              sudo dpkg-deb -x "$deb" "$EXTRACT_TMP"
              if [ -L "$EXTRACT_TMP/lib" ]; then
                echo "[FAIL] package=$package ships a top-level /lib symlink; refusing to alter usr-merged rootfs." | tee -a rootfs-package-extraction.log
                exit 1
              fi
              if [ -d "$EXTRACT_TMP/lib" ]; then
                echo "[INFO] package=$package remap=/lib/* -> /usr/lib/* to preserve usr-merge." | tee -a rootfs-package-extraction.log
                sudo mkdir -p "$ROOTFS/usr/lib"
                sudo cp -a "$EXTRACT_TMP/lib/." "$ROOTFS/usr/lib/"
                sudo rm -rf "$EXTRACT_TMP/lib"
              fi
              sudo cp -a "$EXTRACT_TMP/." "$ROOTFS/"
              sudo test -L "$ROOTFS/lib"
              test "$(sudo readlink "$ROOTFS/lib")" = "usr/lib"
            fi
          done
          sudo rm -rf "$EXTRACT_TMP"
          sudo cp -a "$ROOTFS/var/cache/apt/archives/." "$RUNNER_TEMP/apt-cache/archives/" 2>/dev/null || true
          sudo mkdir -p "$ROOTFS/opt/wine"
          mkdir wine-extract
          tar -xJf downloads/wine.tar.xz -C wine-extract --strip-components=1
          WINE_BIN="$(find wine-extract -type f -path '*/bin/wine' -print -quit)"
          test -n "$WINE_BIN"
          WINE_DIR="$(dirname "$(dirname "$WINE_BIN")")"
          sudo cp -a "$WINE_DIR/." "$ROOTFS/opt/wine/"
          sudo test -L "$ROOTFS/lib"
          test "$(sudo readlink "$ROOTFS/lib")" = "usr/lib"
          sudo test -e "$ROOTFS/lib/ld-linux-aarch64.so.1"
          {
            echo "usrmerge_post_amd64_extraction=passed"
            echo "lib_target=$(sudo readlink "$ROOTFS/lib")"
            sudo ls -ld "$ROOTFS/lib" "$ROOTFS/lib/ld-linux-aarch64.so.1"
          } | tee rootfs-usrmerge-after-amd64.txt

      - name: Validate Wine payloads (fatal) and inventory graphics (warning only)
        run: |
          source runtime/scripts/ci-diagnostics.sh 04-validate-runtime-payloads
          test -x "$ROOTFS/opt/wine/bin/wine"
          sudo readelf -h "$ROOTFS/opt/wine/bin/wine" | grep -q 'Machine:.*Advanced Micro Devices X86-64'
          sudo lddtree -R "$ROOTFS" /opt/wine/bin/wine | tee wine-lddtree.txt
          if grep -Eq '=> None|could not locate library|not found' wine-lddtree.txt; then
            echo "Wine has unresolved x86_64 shared-library dependencies." >&2
            exit 1
          fi
          DRI_DIR="$ROOTFS/usr/lib/x86_64-linux-gnu/dri"
          mkdir -p "$DRI_DIR"
          { echo "### $DRI_DIR"; sudo ls -la "$DRI_DIR"; } | tee mesa-dri-inventory.txt
          EXPECTED_DRIVER="$(python3 -c 'import json,os; print(os.path.basename(json.load(open("runtime/manifest.json"))["components"]["virgl"]["driver"]))')"
          FIRST_DRI_DRIVER="$(find "$DRI_DIR" -maxdepth 1 -type f -name '*.so' -print -quit)"
          if [ -z "$FIRST_DRI_DRIVER" ]; then
            echo "[WARN] No Mesa DRI shared drivers found; graphics remains unvalidated." | tee -a mesa-dri-inventory.txt
          fi
          if [ ! -s "$DRI_DIR/$EXPECTED_DRIVER" ]; then
            echo "[WARN] Manifest driver $EXPECTED_DRIVER is absent; available drivers are recorded above." | tee -a mesa-dri-inventory.txt
          fi
          : > mesa-dri-lddtree.txt
          while IFS= read -r -d '' driver; do
            echo "### $driver" | tee -a mesa-dri-lddtree.txt
            sudo lddtree -R "$ROOTFS" "${driver#"$ROOTFS"}" 2>&1 | tee -a mesa-dri-lddtree.txt || echo "[WARN] Could not resolve dependencies for $driver" | tee -a mesa-dri-lddtree.txt
            if grep -Eq '=> None|could not locate library|not found' mesa-dri-lddtree.txt; then
              echo "[WARN] Mesa DRI driver has unresolved dependencies; Wine smoke may continue." | tee -a mesa-dri-lddtree.txt
            fi
          done < <(find "$DRI_DIR" -maxdepth 1 -type f -name '*.so' -print0)
          for tool in glxinfo xmessage; do
            if [ ! -x "$ROOTFS/usr/bin/$tool" ]; then
              echo "[WARN] Optional graphics diagnostic /usr/bin/$tool is missing." | tee -a mesa-dri-inventory.txt
            fi
          done
          file "$ROOTFS/opt/wine/bin/wine" | tee -a wine-lddtree.txt
      - name: Assert ARM64 ELF interpreter and usr-merged library paths
        run: |
          source runtime/scripts/ci-diagnostics.sh 05-assert-arm64-loader-paths
          sudo readelf -h "$ROOTFS/usr/bin/apt-get" | tee apt-get-elf-header.txt
          sudo readelf -l "$ROOTFS/usr/bin/apt-get" | tee apt-get-elf-program-headers.txt
          sudo readelf -h "$ROOTFS/usr/bin/apt-get" | grep -q 'Machine:.*AArch64'
          sudo readelf -l "$ROOTFS/usr/bin/apt-get" | grep -F '[Requesting program interpreter: /lib/ld-linux-aarch64.so.1]'
          sudo test -L "$ROOTFS/lib"
          test "$(sudo readlink "$ROOTFS/lib")" = "usr/lib"
          sudo test -e "$ROOTFS/lib/ld-linux-aarch64.so.1"
          sudo test -e "$ROOTFS/lib/aarch64-linux-gnu/libc.so.6"
          {
            echo "usrmerge_final_assertion=passed"
            echo "lib_target=$(sudo readlink "$ROOTFS/lib")"
            for loader in /lib /lib/ld-linux-aarch64.so.1 /lib/aarch64-linux-gnu/libc.so.6 /usr/lib/x86_64-linux-gnu; do
              echo "### $loader"
              sudo ls -ld "$ROOTFS$loader" 2>&1 || true
            done
          } | tee apt-get-loader-paths.txt
          sudo find "$ROOTFS" -type l -printf '%p -> %l\n' > rootfs-symlinks-after-amd64.txt
      - name: Install Box64 and verify Bookworm glibc compatibility
        run: |
          source runtime/scripts/ci-diagnostics.sh 05-verify-box64-glibc
          sudo install -D -m 0755 box64-artifact/box64-install/usr/local/bin/box64 "$ROOTFS/usr/local/bin/box64"
          HOST_GLIBC="$(ldd --version | sed -n '1p')"
          ROOTFS_LIBC_PACKAGE="$(sudo dpkg-query --admindir="$ROOTFS/var/lib/dpkg" -W -f='${Version}' libc6:arm64)"
          ROOTFS_GLIBC="${ROOTFS_LIBC_PACKAGE%%-*}"
          objdump -T box64-artifact/box64-install/usr/local/bin/box64 | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -3 | tee box64-glibc-symbols-rootfs-check.txt
          BOX64_GLIBC_MAX="$(tail -n 1 box64-glibc-symbols-rootfs-check.txt | sed 's/^GLIBC_//')"
          {
            echo "runner_glibc=$HOST_GLIBC"
            echo "box64_build_glibc=$(cat box64-artifact/box64-build-glibc.txt)"
            echo "rootfs_libc6_package=$ROOTFS_LIBC_PACKAGE"
            echo "rootfs_glibc=$ROOTFS_GLIBC"
            echo "box64_max_required_glibc=$BOX64_GLIBC_MAX"
          } | tee glibc-compatibility.log
          dpkg --compare-versions "$BOX64_GLIBC_MAX" le "$ROOTFS_GLIBC"
      - name: Run Wine smoke ladder on untrimmed rootfs
        run: |
          source runtime/scripts/ci-diagnostics.sh 06-smoke-wine-untrimmed-rootfs
          mkdir -p runtime-smoke
          bash runtime/scripts/ci-wine-smoke.sh "$ROOTFS" runtime-smoke "$WINEBOOT_TIMEOUT_SECONDS"
      - name: Upload untrimmed Wine smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-wine-smoke-diagnostics
          path: runtime-smoke/
          if-no-files-found: warn
          retention-days: 7
      - name: Trim and package rootfs component
        run: |
          source runtime/scripts/ci-diagnostics.sh 07-trim-package-rootfs
          sudo du -sb "$ROOTFS" > rootfs-size-before-trim.txt
          sudo rm -rf "$ROOTFS"/var/cache/apt/archives/*.deb "$ROOTFS"/var/cache/apt/archives/partial "$ROOTFS"/var/lib/apt/lists/*
          sudo rm -rf "$ROOTFS/usr/share/man" "$ROOTFS/usr/share/info"
          sudo rm -rf "$ROOTFS/var/cache/"*
          sudo find "$ROOTFS/usr/share/locale" -mindepth 1 -maxdepth 1 ! -name en ! -name en_US ! -name en_GB -exec rm -rf {} +
          sudo rm -rf "$ROOTFS/usr/include"
          sudo find "$ROOTFS" -type f -name '*.a' -delete
          sudo find "$ROOTFS" -type f -name '*.debug' -delete
          sudo find "$ROOTFS" -type d -name __pycache__ -prune -exec rm -rf {} +
          sudo find "$ROOTFS/usr/share/doc" -type f ! -name copyright -delete
          sudo find "$ROOTFS/usr/share/doc" -mindepth 1 -type d -empty -delete
          sudo du -sb "$ROOTFS" > rootfs-size-after-trim.txt
          sudo python3 - "$ROOTFS" <<'PY'
          import os
          import sys

          root = os.path.abspath(sys.argv[1])
          rewritten = 0
          for current, directories, files in os.walk(root, followlinks=False):
              for name in list(directories) + files:
                  path = os.path.join(current, name)
                  if not os.path.islink(path):
                      continue
                  target = os.readlink(path)
                  if os.path.isabs(target):
                      mapped = os.path.normpath(os.path.join(root, target.lstrip(os.sep)))
                  else:
                      mapped = os.path.normpath(os.path.join(current, target))
                  if os.path.commonpath((root, mapped)) != root:
                      raise SystemExit("Symlink escapes guest rootfs: %s -> %s" % (path, target))
                  if os.path.isabs(target):
                      relative = os.path.relpath(mapped, current)
                      os.unlink(path)
                      os.symlink(relative, path)
                      rewritten += 1
          print("Rewrote %d absolute symlinks; all symlinks remain rootfs-confined." % rewritten)
          PY
          sudo dpkg-query --admindir="$ROOTFS/var/lib/dpkg" -W -f='${Package}:${Architecture}=${Version}\n' > rootfs-package-manifest.txt
          cat rootfs-package-manifest-amd64.txt >> rootfs-package-manifest.txt
          mkdir -p rootfs-artifact/provenance/licenses
          cp runtime/licenses/WINE-LICENSE runtime/licenses/WINE-COPYING.LIB runtime/licenses/WINE-NOTICES.md rootfs-artifact/provenance/licenses/
          cp wine-lddtree.txt mesa-dri-inventory.txt mesa-dri-lddtree.txt rootfs-package-manifest.txt rootfs-size-before-trim.txt rootfs-size-after-trim.txt glibc-compatibility.log box64-glibc-symbols-rootfs-check.txt rootfs-artifact/provenance/
          cp box64-artifact/box64-build-glibc.txt box64-artifact/box64-glibc-symbols.txt box64-artifact/box64-ldd.txt rootfs-artifact/provenance/
          cp runtime-smoke/* rootfs-artifact/provenance/
          EXPECTED_DRIVER="$(python3 -c 'import json,os; print(os.path.basename(json.load(open("runtime/manifest.json"))["components"]["virgl"]["driver"]))')"
          printf 'expected_guest_driver=%s\narchitecture=x86_64\nsource=Debian Bookworm libgl1-mesa-dri\ntransport=virtio-gpu DRM; Android vtest/virpipe compatibility unproven\n' "$EXPECTED_DRIVER" > rootfs-artifact/provenance/MESA-VIRGL-BUILD-INFO.txt
          sha256sum downloads/wine.tar.xz > rootfs-artifact/provenance/UPSTREAM-ARCHIVE-SHA256SUMS
          printf 'debian_suite=%s\nrootfs_arch=arm64\nforeign_arch=amd64\nbox64_profile=Snapdragon 888\nwine=11.19-amd64\ndxvk=not-bundled\n' "$DEBIAN_SUITE" > rootfs-artifact/provenance/ROOTFS-BUILD-INFO.txt
          sudo tar --numeric-owner --xattrs --acls --exclude='rootfs/dev/*' \
            -czf "$GITHUB_WORKSPACE/rootfs-component.tar.gz" \
            -C "$GITHUB_WORKSPACE/rootfs-artifact" rootfs provenance
          sudo chown "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/rootfs-component.tar.gz"
          sha256sum rootfs-component.tar.gz > rootfs-component.tar.gz.sha256
      - name: Upload glibc rootfs and Wine components
        uses: actions/upload-artifact@v4
        with:
          name: runtime-rootfs-arm64-bookworm
          path: |
            rootfs-component.tar.gz
            rootfs-component.tar.gz.sha256
          if-no-files-found: error
          retention-days: 3
      - name: Collect runtime diagnostics
        if: always()
        run: |
          set +e
          mkdir -p logs runtime-failure-logs
          for f in apt-get-download.log apt-get-elf-header.txt apt-get-elf-program-headers.txt apt-get-loader-paths.txt rootfs-package-manifest-amd64.txt rootfs-package-extraction.log rootfs-usrmerge-before-amd64.txt rootfs-usrmerge-after-amd64.txt rootfs-symlinks-after-amd64.txt rootfs-symlinks-before-loader-fix.txt box64-ccache-stats.txt box64-ldd.txt box64-build-glibc.txt box64-glibc-symbols.txt box64-glibc-symbols-rootfs-check.txt glibc-compatibility.log wine-lddtree.txt mesa-dri-inventory.txt mesa-dri-lddtree.txt; do
            [ -f "$f" ] && cp "$f" runtime-failure-logs/
          done
          sudo dpkg --audit > runtime-failure-logs/dpkg-audit.txt 2>&1
          df -h > runtime-failure-logs/disk-space.txt
          free -h > runtime-failure-logs/memory.txt
          printf 'DEBIAN_SUITE=%s\nROOTFS=%s\nRUNNER_TEMP=%s\nGITHUB_WORKSPACE=%s\n' "$DEBIAN_SUITE" "$ROOTFS" "$RUNNER_TEMP" "$GITHUB_WORKSPACE" > runtime-failure-logs/environment.txt
          if [ -d "$ROOTFS" ]; then
            sudo find "$ROOTFS" -maxdepth 6 -printf '%y %m %u:%g %s %p -> %l\n' > runtime-failure-logs/rootfs-find-full.txt 2>&1
            sed -n '1,2500p' runtime-failure-logs/rootfs-find-full.txt > runtime-failure-logs/rootfs-find.txt
            sudo ls -lR "$ROOTFS" > runtime-failure-logs/rootfs-ls-full.txt 2>&1
            sed -n '1,2500p' runtime-failure-logs/rootfs-ls-full.txt > runtime-failure-logs/rootfs-ls.txt
            sudo find "$ROOTFS" -type l -printf '%p -> %l\n' > runtime-failure-logs/rootfs-symlinks.txt 2>&1
            sudo du -sb "$ROOTFS" > runtime-failure-logs/rootfs-size-bytes.txt 2>&1
            sudo du -sh "$ROOTFS" > runtime-failure-logs/rootfs-size-human.txt 2>&1
            for key in opt/wine/bin usr/bin usr/lib/x86_64-linux-gnu/dri usr/lib/x86_64-linux-gnu; do
              {
                echo "### $key"
                sudo ls -la "$ROOTFS/$key"
              } >> runtime-failure-logs/rootfs-key-directories.txt 2>&1
            done
          else
            echo "ROOTFS directory does not exist: $ROOTFS" > runtime-failure-logs/rootfs-find.txt
          fi
          {
            for tool in dpkg dpkg-deb ar tar xz zstd qemu-aarch64-static qemu-aarch64 update-binfmts; do
              echo "### $tool"
              if command -v "$tool" >/dev/null 2>&1; then
                command -v "$tool"
                case "$tool" in
                  dpkg|dpkg-deb) "$tool" --version 2>&1 | head -n 2 ;;
                  ar) "$tool" --version 2>&1 | head -n 2 ;;
                  tar) "$tool" --version 2>&1 | head -n 2 ;;
                  xz) "$tool" --version 2>&1 | head -n 2 ;;
                  zstd) "$tool" --version 2>&1 | head -n 2 ;;
                  qemu-aarch64-static|qemu-aarch64) "$tool" --version 2>&1 | head -n 2 ;;
                  update-binfmts) "$tool" --version 2>&1 | head -n 2 ;;
                esac
              else
                echo "not installed"
              fi
            done
            echo "### binfmt_misc"
            mount | grep binfmt_misc || true
            ls -la /proc/sys/fs/binfmt_misc 2>&1 || true
          } > runtime-failure-logs/tool-versions.txt
      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-build-diagnostics
          path: |
            logs/
            runtime-failure-logs/
          if-no-files-found: warn
          retention-days: 7

  assemble:
    name: Assemble installable app-private runtime archive
    runs-on: ubuntu-24.04-arm
    needs: [build-box64, build-rootfs]
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify native ARM64 runner and record CPU
        run: |
          set -euo pipefail
          { echo "uname_m=$(uname -m)"; echo "nproc=$(nproc)"; echo "runner_arch=${RUNNER_ARCH:-unknown}"; echo "runner_os=${RUNNER_OS:-unknown}"; lscpu | grep -E "^(Architecture|CPU|Model name|Vendor ID|Byte Order)" || true; grep -m 6 -E "^(processor|model name|CPU implementer|CPU part|Features)" /proc/cpuinfo; } | tee runner-arm64-environment.log
          test "$(uname -m)" = "aarch64"
          test "${RUNNER_ARCH}" = "ARM64"
      - name: Install runtime validation tools
        run: sudo apt-get update && sudo apt-get install -y file binutils binutils-x86-64-linux-gnu pax-utils
      - name: Download Box64 artifact
        uses: actions/download-artifact@v4
        with:
          name: box64-arm64-glibc-sd888
          path: box64-artifact
      - name: Download glibc rootfs component
        uses: actions/download-artifact@v4
        with:
          name: runtime-rootfs-arm64-bookworm
          path: rootfs-archive
      - name: Assemble archive and checksums
        run: |
          source runtime/scripts/ci-diagnostics.sh 06-assemble-runtime-archive
          OUT="$GITHUB_WORKSPACE/runtime-bundle"
          mkdir -p "$OUT" rootfs-unpacked
          (cd rootfs-archive && sha256sum -c rootfs-component.tar.gz.sha256)
          tar -xzf rootfs-archive/rootfs-component.tar.gz -C rootfs-unpacked
          test -d rootfs-unpacked/rootfs
          test -d rootfs-unpacked/provenance
          cp -a rootfs-unpacked/rootfs "$OUT/rootfs"
          sudo install -D -m 0755 box64-artifact/box64-install/usr/local/bin/box64 "$OUT/rootfs/usr/local/bin/box64"
          cp -a rootfs-unpacked/provenance "$OUT/provenance"
          mkdir -p "$OUT/provenance/licenses"
          cp box64-artifact/box64-src/LICENSE "$OUT/provenance/licenses/BOX64-LICENSE"
          cp box64-artifact/box64-upstream-commit.txt box64-artifact/box64-ldd.txt box64-artifact/box64-ccache-stats.txt "$OUT/provenance/"
          cp runtime/rootfs/README.md "$OUT/README.md"
          cp runner-arm64-environment.log "$OUT/provenance/"
          sudo du -sb "$OUT/rootfs" > runtime-tree-size-before-strip.txt
          : > runtime-strip-failures.txt
          while IFS= read -r -d '' elf; do
            if file -b "$elf" | grep -q '^ELF'; then
              if file -b "$elf" | grep -q 'x86-64'; then
                x86_64-linux-gnu-strip --strip-unneeded "$elf" || printf '%s\n' "$elf" >> runtime-strip-failures.txt
              else
                strip --strip-unneeded "$elf" || printf '%s\n' "$elf" >> runtime-strip-failures.txt
              fi
            fi
          done < <(find "$OUT/rootfs" -type f -print0)
          sudo du -sb "$OUT/rootfs" > runtime-tree-size-after-strip.txt
          cp runtime-strip-failures.txt runtime-tree-size-before-strip.txt runtime-tree-size-after-strip.txt "$OUT/provenance/"
          file "$OUT/rootfs/usr/local/bin/box64" "$OUT/rootfs/opt/wine/bin/wine"
          (cd "$OUT" && sha256sum rootfs/usr/local/bin/box64 rootfs/opt/wine/bin/wine > provenance/RUNTIME-SHA256SUMS)
          tar --numeric-owner --xattrs --acls -czf ghost-town-wine-runtime-arm64.tar.gz -C "$OUT" .
          sha256sum ghost-town-wine-runtime-arm64.tar.gz > ghost-town-wine-runtime-arm64.tar.gz.sha256
          python3 tools/validate_runtime_archive.py ghost-town-wine-runtime-arm64.tar.gz
          du -h ghost-town-wine-runtime-arm64.tar.gz
          python3 tools/audit_runtime_tree.py "$OUT" | tee runtime-tree-size-audit.txt
          printf '\nARCHIVE_BYTES=' >> runtime-tree-size-audit.txt
          stat -c '%s' ghost-town-wine-runtime-arm64.tar.gz >> runtime-tree-size-audit.txt
      - name: Upload complete runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: ghost-town-wine-runtime-0.5.0-alpha.2-arm64-debian-bookworm
          path: |
            ghost-town-wine-runtime-arm64.tar.gz
            ghost-town-wine-runtime-arm64.tar.gz.sha256
            runtime-tree-size-audit.txt
          if-no-files-found: error
          retention-days: 30


  build-report:
    name: Build report (always)
    if: always()
    needs: [build-box64, build-rootfs, assemble]
    uses: ./.github/workflows/build-report.yml
    with:
      workflow_name: ${{ github.workflow }}
      job_results: ${{ toJSON(needs) }}
