name: Build Complete ARM64 Wine Runtime Bundle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-wine-runtime-bundle.yml'
  workflow_dispatch:
    inputs:
      debian_suite:
        description: Debian suite for the ARM64 glibc rootfs
        required: true
        default: bookworm
        type: choice
        options: [bookworm]
      box64_ref:
        description: Box64 upstream ref
        required: true
        default: main
        type: string
      proot_ref:
        description: Android PRoot upstream ref
        required: true
        default: main
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-proot:
    name: Build Android ARM64 PRoot (NDK x86_64 host)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PROOT_REF: ${{ inputs.proot_ref || '6f8ebfd8e24887dfba64c3f2d7d5fe9dc059b60e' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;28.2.13676358'
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y git make python3 file binutils
      - name: Build static Android ARM64 PRoot and loaders
        run: |
          set -euo pipefail
          git clone https://github.com/berilevi/proot-static.git proot-src
          git -C proot-src checkout --detach "$PROOT_REF"
          git -C proot-src rev-parse HEAD > proot-upstream-commit.txt
          cd proot-src
          NDK="$ANDROID_HOME/ndk/28.2.13676358" \
          OUT="$RUNNER_TEMP/proot-static-build" \
          REPO_ARTIFACT_DIR="$GITHUB_WORKSPACE/proot-src/dist/aarch64" \
            tools/build-static-aarch64.sh
          cd "$GITHUB_WORKSPACE"
          SRC="proot-src/dist/aarch64"
          OUT="proot-artifact"
          mkdir -p "$OUT/root/bin" "$OUT/root/libexec/proot" "$OUT/provenance"
          install -m 0755 "$SRC/proot" "$OUT/root/bin/proot"
          install -m 0755 "$SRC/loader" "$OUT/root/libexec/proot/loader"
          install -m 0755 "$SRC/loader32" "$OUT/root/libexec/proot/loader32"
          for f in "$OUT/root/bin/proot" "$OUT/root/libexec/proot/loader"; do
            readelf -h "$f" | grep -q 'Class:.*ELF64'
            readelf -h "$f" | grep -q 'Machine:.*AArch64'
            if readelf -l "$f" | grep -q 'Requesting program interpreter'; then exit 1; fi
          done
          readelf -h "$OUT/root/libexec/proot/loader32" | grep -q 'Class:.*ELF32'
          readelf -h "$OUT/root/libexec/proot/loader32" | grep -q 'Machine:.*ARM'
          if readelf -l "$OUT/root/libexec/proot/loader32" | grep -q 'Requesting program interpreter'; then exit 1; fi
          cp proot-src/COPYING "$OUT/provenance/PROOT-COPYING"
          cp proot-upstream-commit.txt "$OUT/provenance/"
          printf 'source=https://github.com/berilevi/proot-static\nabi=arm64-v8a\nloader32=arm-eabi\nlinkage=static\nndk=28.2.13676358\n' > "$OUT/provenance/PROOT-BUILD-INFO.txt"
          (cd "$OUT" && sha256sum root/bin/proot root/libexec/proot/loader root/libexec/proot/loader32 > provenance/PROOT-SHA256SUMS)
      - name: Upload PRoot component
        uses: actions/upload-artifact@v4
        with:
          name: runtime-proot-android-arm64
          path: proot-artifact/
          if-no-files-found: error
          retention-days: 3

  build-rootfs:
    name: Build ARM64 glibc rootfs and Windows runtime components
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      DEBIAN_SUITE: ${{ inputs.debian_suite || 'bookworm' }}
      BOX64_REF: ${{ inputs.box64_ref || '7fab05334445948c918281b54f2a604ff63337f7' }}
      WINE_SHA256: 40068b3825887224d4b95364e3f49342d4bf7efac5486614b8bc4e7173bbef3e
      DXVK_SHA256: 40565b4a724aadc4433fa4e010b4b23916d9b1f1baeee64e17186db94f54e608
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap git cmake ninja-build build-essential \
            file binutils libcapstone-dev curl xz-utils tar python3 pax-utils \
            qemu-user-static binfmt-support
          # Register the x86_64 ELF handler on this ARM64 runner before any
          # amd64 package maintainer script is executed inside the chroot.
          sudo modprobe binfmt_misc || true
          if ! mountpoint -q /proc/sys/fs/binfmt_misc; then
            sudo mount -t binfmt_misc binfmt_misc /proc/sys/fs/binfmt_misc
          fi
          # GitHub's ARM64 runner may pre-register QEMU in the kernel without
          # shipping a matching update-binfmts database entry. Prefer the live
          # kernel registration; only import/enable a descriptor when absent.
          if [ -r /proc/sys/fs/binfmt_misc/qemu-x86_64 ]; then
            cat /proc/sys/fs/binfmt_misc/qemu-x86_64
            grep -q '^enabled' /proc/sys/fs/binfmt_misc/qemu-x86_64
          else
            sudo update-binfmts --import qemu-x86_64 || true
            sudo update-binfmts --enable qemu-x86_64
            test -r /proc/sys/fs/binfmt_misc/qemu-x86_64
            grep -q '^enabled' /proc/sys/fs/binfmt_misc/qemu-x86_64
          fi
      - name: Build Box64 for ARM64 glibc
        run: |
          set -euo pipefail
          git clone https://github.com/ptitSeb/box64.git box64-src
          git -C box64-src checkout --detach "$BOX64_REF"
          git -C box64-src rev-parse HEAD > box64-upstream-commit.txt
          cmake -S box64-src -B box64-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DSD888=ON \
            -DARM_DYNAREC=ON \
            -DNO_LIB_INSTALL=ON \
            -DNO_CONF_INSTALL=ON
          cmake --build box64-build --parallel 2
          install -D -m 0755 "$(find box64-build -type f -name box64 -perm -111 -print -quit)" box64-install/usr/local/bin/box64
          file box64-install/usr/local/bin/box64
          readelf -h box64-install/usr/local/bin/box64 | grep -q 'Machine:.*AArch64'
          ldd box64-install/usr/local/bin/box64 | tee box64-ldd.txt

      - name: Download and verify pinned Wine and DXVK
        run: |
          set -euo pipefail
          mkdir -p downloads
          curl -fL --retry 3 https://github.com/Kron4ek/Wine-Builds/releases/download/11.19/wine-11.19-amd64.tar.xz -o downloads/wine.tar.xz
          curl -fL --retry 3 https://github.com/doitsujin/DXVK/releases/download/v3.1.1/dxvk-3.1.1.tar.gz -o downloads/dxvk.tar.gz
          echo "$WINE_SHA256  downloads/wine.tar.xz" | sha256sum -c -
          echo "$DXVK_SHA256  downloads/dxvk.tar.gz" | sha256sum -c -

      - name: Bootstrap Debian ARM64 glibc rootfs and amd64 Wine libraries
        run: |
          set -euo pipefail
          ROOTFS="$GITHUB_WORKSPACE/rootfs-artifact/rootfs"
          mkdir -p "$ROOTFS"
          sudo debootstrap --arch=arm64 --variant=minbase \
            --include=ca-certificates,locales,libstdc++6,libgcc-s1,libcapstone4 \
            "$DEBIAN_SUITE" "$ROOTFS" https://deb.debian.org/debian
          sudo cp /etc/resolv.conf "$ROOTFS/etc/resolv.conf"
          # Keep a private emulator copy in the guest root while dpkg runs.
          # The host binfmt registration handles normal execve from maintainer scripts.
          sudo install -D -m 0755 "$(command -v qemu-x86_64-static)" \
            "$ROOTFS/usr/bin/qemu-x86_64-static"
          file "$ROOTFS/usr/bin/qemu-x86_64-static"
          sudo chroot "$ROOTFS" /usr/bin/dpkg --add-architecture amd64
          sudo chroot "$ROOTFS" /usr/bin/apt-get update
          sudo chroot "$ROOTFS" /usr/bin/apt-get install -y --no-install-recommends \
            libc6:amd64 libgcc-s1:amd64 libstdc++6:amd64 zlib1g:amd64 \
            libasound2:amd64 libpulse0:amd64 libdbus-1-3:amd64 \
            libfreetype6:amd64 libfontconfig1:amd64 libgnutls30:amd64 \
            libx11-6:amd64 libxext6:amd64 libxrender1:amd64 libxrandr2:amd64 \
            libxi6:amd64 libxcursor1:amd64 libxinerama1:amd64 \
            libxcomposite1:amd64 libxdamage1:amd64 libxfixes3:amd64 \
            libxkbcommon0:amd64 libxss1:amd64 libxtst6:amd64 \
            libxmu6:amd64 libxpm4:amd64 \
            libwayland-client0:amd64 libwayland-egl1:amd64 \
            libvulkan1:amd64 libgl1:amd64 libegl1:amd64 libgbm1:amd64 \
            libgl1-mesa-dri:amd64 libglx-mesa0:amd64 libegl-mesa0:amd64 \
            libglx0:amd64 libdrm2:amd64 mesa-utils:amd64 x11-utils:amd64 \
            libunwind8:amd64 libatomic1:amd64 libglib2.0-0:amd64 \
            libgstreamer1.0-0:amd64 libgstreamer-plugins-base1.0-0:amd64 \
            libkrb5-3:amd64 libldap-2.5-0:amd64
          sudo install -D -m 0755 box64-install/usr/local/bin/box64 "$ROOTFS/usr/local/bin/box64"
          sudo mkdir -p "$ROOTFS/opt/wine" "$ROOTFS/opt/dxvk"
          mkdir wine-extract dxvk-extract
          tar -xJf downloads/wine.tar.xz -C wine-extract --strip-components=1
          WINE_BIN="$(find wine-extract -type f -path '*/bin/wine' -print -quit)"
          test -n "$WINE_BIN"
          WINE_DIR="$(dirname "$(dirname "$WINE_BIN")")"
          sudo cp -a "$WINE_DIR/." "$ROOTFS/opt/wine/"
          tar -xzf downloads/dxvk.tar.gz -C dxvk-extract --strip-components=1
          test -d dxvk-extract/x64 && test -d dxvk-extract/x32
          sudo cp -a dxvk-extract/. "$ROOTFS/opt/dxvk/"
          test -x "$ROOTFS/opt/wine/bin/wine"
          test -x "$ROOTFS/usr/local/bin/box64"
          test -s "$ROOTFS/opt/dxvk/x64/d3d11.dll"
          test -s "$ROOTFS/opt/dxvk/x64/dxgi.dll"
          sudo readelf -h "$ROOTFS/opt/wine/bin/wine" | grep -q 'Machine:.*Advanced Micro Devices X86-64'
          test -s "$ROOTFS/usr/lib/x86_64-linux-gnu/dri/virgl_dri.so"
          test -x "$ROOTFS/usr/bin/glxinfo"
          test -x "$ROOTFS/usr/bin/xmessage"
          sudo lddtree -R "$ROOTFS" /usr/lib/x86_64-linux-gnu/dri/virgl_dri.so | tee virgl-lddtree.txt
          if grep -Eq '=> None|could not locate library|not found' virgl-lddtree.txt; then
            echo "Mesa VirGL driver has unresolved x86_64 shared-library dependencies." >&2
            exit 1
          fi
          sudo lddtree -R "$ROOTFS" /opt/wine/bin/wine | tee wine-lddtree.txt
          if grep -Eq '=> None|could not locate library|not found' wine-lddtree.txt; then
            echo "Wine has unresolved x86_64 shared-library dependencies." >&2
            exit 1
          fi
          # Prove that Box64 can execute the pinned x86_64 Wine binary on this
          # ARM64 runner, and record the ELF architecture of the critical payloads.
          file "$ROOTFS/opt/wine/bin/wine" \
            "$ROOTFS/usr/lib/x86_64-linux-gnu/dri/virgl_dri.so" \
            "$ROOTFS/usr/bin/glxinfo" "$ROOTFS/usr/bin/xmessage"
          sudo chroot "$ROOTFS" /usr/local/bin/box64 /opt/wine/bin/wine --version \
            | tee wine-box64-smoke.txt
          grep -Eiq 'wine-11\.19|wine version 11\.19' wine-box64-smoke.txt
          # The host binfmt path is no longer needed after package configuration.
          sudo rm -f "$ROOTFS/usr/bin/qemu-x86_64-static"
          sudo chroot "$ROOTFS" /usr/bin/apt-get clean
          sudo rm -rf "$ROOTFS/var/lib/apt/lists/"* "$ROOTFS/usr/share/man/"* "$ROOTFS/usr/share/locale/"*
          sudo find "$ROOTFS/usr/share/doc" -type f ! -name copyright -delete
          sudo find "$ROOTFS/usr/share/doc" -mindepth 1 -type d -empty -delete
          # The Android installer rejects absolute/escaping symlinks. In a chroot,
          # absolute links resolve from the guest root; rewrite them as equivalent
          # relative links that remain inside this rootfs before packaging.
          sudo python3 - "$ROOTFS" <<'PY'
          import os
          import sys

          root = os.path.abspath(sys.argv[1])
          rewritten = 0
          for current, directories, files in os.walk(root, followlinks=False):
              for name in list(directories) + files:
                  path = os.path.join(current, name)
                  if not os.path.islink(path):
                      continue
                  target = os.readlink(path)
                  if os.path.isabs(target):
                      mapped = os.path.normpath(os.path.join(root, target.lstrip(os.sep)))
                  else:
                      mapped = os.path.normpath(os.path.join(current, target))
                  if os.path.commonpath((root, mapped)) != root:
                      raise SystemExit("Symlink escapes guest rootfs: %s -> %s" % (path, target))
                  if os.path.isabs(target):
                      relative = os.path.relpath(mapped, current)
                      os.unlink(path)
                      os.symlink(relative, path)
                      rewritten += 1
          print("Rewrote %d absolute symlinks; all symlinks remain rootfs-confined." % rewritten)
          PY
          sudo dpkg-query --admindir="$ROOTFS/var/lib/dpkg" -W -f='${Package}:${Architecture}=${Version}\n' > rootfs-package-manifest.txt
          mkdir -p rootfs-artifact/provenance/licenses
          cp box64-src/LICENSE rootfs-artifact/provenance/licenses/BOX64-LICENSE
          cp runtime/licenses/WINE-LICENSE runtime/licenses/WINE-COPYING.LIB runtime/licenses/WINE-NOTICES.md runtime/licenses/DXVK-LICENSE rootfs-artifact/provenance/licenses/
          cp box64-upstream-commit.txt box64-ldd.txt wine-lddtree.txt virgl-lddtree.txt rootfs-package-manifest.txt wine-box64-smoke.txt rootfs-artifact/provenance/
          printf 'guest_driver=virgl_dri.so\narchitecture=x86_64\nsource=Debian Bookworm libgl1-mesa-dri\ntransport=VirGL over X11/DRI3\n' > rootfs-artifact/provenance/MESA-VIRGL-BUILD-INFO.txt
          sha256sum downloads/wine.tar.xz downloads/dxvk.tar.gz > rootfs-artifact/provenance/UPSTREAM-ARCHIVE-SHA256SUMS
          printf 'debian_suite=%s\nrootfs_arch=arm64\nforeign_arch=amd64\nbox64_profile=Snapdragon 888\nwine=11.19-amd64\ndxvk=3.1.1\n' "$DEBIAN_SUITE" > rootfs-artifact/provenance/ROOTFS-BUILD-INFO.txt
          # Upload one root-owned archive instead of traversing restricted Debian paths.
          # /dev is bind-mounted from Android by PRoot; omit Linux device nodes because
          # unprivileged artifact extraction cannot recreate mknod entries.
          sudo tar --numeric-owner --xattrs --acls --exclude='rootfs/dev/*' \
            -czf "$GITHUB_WORKSPACE/rootfs-component.tar.gz" \
            -C "$GITHUB_WORKSPACE/rootfs-artifact" rootfs provenance
          sudo chown "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/rootfs-component.tar.gz"
          sha256sum rootfs-component.tar.gz > rootfs-component.tar.gz.sha256
      - name: Upload glibc rootfs and Wine components
        uses: actions/upload-artifact@v4
        with:
          name: runtime-rootfs-arm64-bookworm
          path: |
            rootfs-component.tar.gz
            rootfs-component.tar.gz.sha256
          if-no-files-found: error
          retention-days: 3

  assemble:
    name: Assemble installable app-private runtime archive
    runs-on: ubuntu-24.04
    needs: [build-proot, build-rootfs]
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download PRoot component
        uses: actions/download-artifact@v4
        with:
          name: runtime-proot-android-arm64
          path: proot-artifact
      - name: Download glibc rootfs component
        uses: actions/download-artifact@v4
        with:
          name: runtime-rootfs-arm64-bookworm
          path: rootfs-archive
      - name: Assemble archive and checksums
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/runtime-bundle"
          mkdir -p "$OUT" rootfs-unpacked
          (cd rootfs-archive && sha256sum -c rootfs-component.tar.gz.sha256)
          tar -xzf rootfs-archive/rootfs-component.tar.gz -C rootfs-unpacked
          test -d rootfs-unpacked/rootfs
          test -d rootfs-unpacked/provenance
          cp -a proot-artifact/root/. "$OUT/"
          cp -a rootfs-unpacked/rootfs "$OUT/rootfs"
          cp -a rootfs-unpacked/provenance "$OUT/provenance"
          cp -a proot-artifact/provenance/. "$OUT/provenance/"
          mkdir -p "$OUT/provenance/licenses"
          cp proot-artifact/provenance/PROOT-COPYING "$OUT/provenance/licenses/PROOT-COPYING"
          cp runtime/rootfs/README.md "$OUT/README.md"
          (cd "$OUT" && sha256sum bin/proot libexec/proot/loader libexec/proot/loader32 rootfs/usr/local/bin/box64 rootfs/opt/wine/bin/wine rootfs/opt/dxvk/x64/d3d11.dll rootfs/opt/dxvk/x64/dxgi.dll rootfs/usr/lib/x86_64-linux-gnu/dri/virgl_dri.so rootfs/usr/bin/glxinfo rootfs/usr/bin/xmessage > provenance/RUNTIME-SHA256SUMS)
          tar --numeric-owner --xattrs --acls -czf ghost-town-wine-runtime-arm64.tar.gz -C "$OUT" .
          sha256sum ghost-town-wine-runtime-arm64.tar.gz > ghost-town-wine-runtime-arm64.tar.gz.sha256
          du -h ghost-town-wine-runtime-arm64.tar.gz
          python3 tools/audit_runtime_tree.py "$OUT" | tee runtime-tree-size-audit.txt
          printf '\\nARCHIVE_BYTES=' >> runtime-tree-size-audit.txt
          stat -c '%s' ghost-town-wine-runtime-arm64.tar.gz >> runtime-tree-size-audit.txt
      - name: Upload complete runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: ghost-town-wine-runtime-arm64-debian-bookworm
          path: |
            ghost-town-wine-runtime-arm64.tar.gz
            ghost-town-wine-runtime-arm64.tar.gz.sha256
            runtime-tree-size-audit.txt
          if-no-files-found: error
          retention-days: 30
      - name: Attach runtime bundle to v0.5.0-alpha.2 pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.0-alpha.2
          target_commitish: main
          name: Ghost Town Recomp 0.5.0-alpha.2 - VirGL Guest Runtime
          prerelease: true
          body: |
            PRE-RELEASE ONLY. This bundle is a separately managed runtime payload for integration testing.
            The Android alpha APK provides a managed HTTPS download action for this project-owned archive with SHA-256 verification and transactional app-private extraction. Physical-device download/install validation is still pending.
            Includes Debian Bookworm ARM64/glibc, Box64, Wine 11.19 amd64, DXVK 3.1.1, Mesa VirGL guest DRI driver, X11/GLX smoke utilities, and static Android ARM64 PRoot.
            No claim of Overcooked 2 execution or playability. The X11/VirGL display session is an integration foundation only; physical-device X11, GLX/VirGL, WineD3D, audio/input, and gameplay validation remain pending. DXVK/guest Vulkan remains a separate unvalidated path.
            See docs/V0.4.0_EXECUTION_GATES.md and docs/PROVENANCE.md.
          files: |
            ghost-town-wine-runtime-arm64.tar.gz
            ghost-town-wine-runtime-arm64.tar.gz.sha256
          fail_on_unmatched_files: true
