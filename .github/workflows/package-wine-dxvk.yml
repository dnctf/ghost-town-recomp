name: Package Wine and DXVK runtime components

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package-wine-dxvk.yml'
      - 'docs/runtime-bundle-README.md'
      - 'docs/BOX64_ANDROID_RUNTIME.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-runtime:
    name: Fetch, verify and package Wine x86_64 + DXVK
    runs-on: ubuntu-24.04
    steps:
      - name: Install archive tools
        run: sudo apt-get update && sudo apt-get install -y curl xz-utils tar file python3

      - name: Fetch pinned Wine and DXVK releases
        run: |
          set -euo pipefail
          mkdir -p downloads bundle/wine bundle/dxvk
          WINE_FILE=wine-11.19-amd64.tar.xz
          DXVK_FILE=dxvk-3.1.1.tar.gz
          curl -fL --retry 3 "https://github.com/Kron4ek/Wine-Builds/releases/download/11.19/$WINE_FILE" -o "downloads/$WINE_FILE"
          curl -fL --retry 3 "https://github.com/doitsujin/DXVK/releases/download/v3.1.1/$DXVK_FILE" -o "downloads/$DXVK_FILE"

      - name: Verify upstream release SHA-256
        run: |
          set -euo pipefail
          echo "40068b3825887224d4b95364e3f49342d4bf7efac5486614b8bc4e7173bbef3e  downloads/wine-11.19-amd64.tar.xz" | sha256sum -c -
          echo "40565b4a724aadc4433fa4e010b4b23916d9b1f1baeee64e17186db94f54e608  downloads/dxvk-3.1.1.tar.gz" | sha256sum -c -

      - name: Extract and validate runtime components
        run: |
          set -euo pipefail
          tar -xJf downloads/wine-11.19-amd64.tar.xz -C bundle/wine --strip-components=1
          tar -xzf downloads/dxvk-3.1.1.tar.gz -C bundle/dxvk --strip-components=1
          find bundle/wine -maxdepth 3 -type f -name wine -print
          test -d bundle/dxvk/x64
          test -d bundle/dxvk/x32
          WINE_BIN="$(find bundle/wine -type f -path '*/bin/wine' -print -quit)"
          test -n "$WINE_BIN"
          chmod +x "$WINE_BIN"
          mkdir -p bundle/provenance
          sha256sum downloads/* > bundle/provenance/SHA256SUMS
          printf 'Wine=11.19 amd64\nDXVK=3.1.1\nWine target=Linux x86_64; requires Box64 + ARM64 glibc userspace\nDXVK target=Windows DLLs for Wine prefix; requires Vulkan bridge\n' > bundle/provenance/COMPONENTS.txt
          cat > bundle/README.txt <<'EOF'
Wine x86_64 requires Box64 plus an ARM64 glibc userspace and matching libraries. DXVK DLLs install into a Wine prefix and require a working Vulkan path. This bundle is not a standalone Android runtime or proof of game compatibility.
EOF

      - name: Upload runtime component bundle
        uses: actions/upload-artifact@v4
        with:
          name: ghost-town-wine-11.19-dxvk-3.1.1
          path: bundle/
          if-no-files-found: error
          retention-days: 30
