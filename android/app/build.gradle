plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.overcookedrecomp.app'
    compileSdk 34
    ndkVersion '26.3.11579264'

    // Generate the BuildConfig class used by RuntimeBundleDownloader.
    buildFeatures {
        buildConfig true
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'
    }

    defaultConfig {
        applicationId "com.overcookedrecomp.app"
        minSdk 29
        targetSdk 34
        versionCode 11
        versionName "0.5.0-alpha.2"
        buildConfigField "String", "RUNTIME_MANIFEST_URL", "\"https://raw.githubusercontent.com/dnctf/ghost-town-recomp/main/runtime/manifest.json\""

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++20 -O3 -fvisibility=hidden -Wall -Wextra"
                arguments "-DANDROID_STL=c++_static", "-DANDROID_PLATFORM=android-29"
                cFlags "-Wl,-z,max-page-size=16384"
            }
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += ['**/libproot.so', '**/libproot-loader.so']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".uipreview"
            jniDebuggable true
        }
    }

    externalNativeBuild {
        cmake {
            path "../native/CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation project(':winlator-core')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'org.apache.commons:commons-compress:1.27.1'

    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    testImplementation 'junit:junit:4.13.2'
}
