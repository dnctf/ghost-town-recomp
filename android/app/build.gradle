plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.overcookedrecomp.app'
    compileSdk 34
    ndkVersion '26.3.11579264'

    // Generate the BuildConfig class used by RuntimeBundleDownloader.
    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.overcookedrecomp.app"
        minSdk 29
        targetSdk 34
        versionCode 10
        versionName "0.5.0-alpha.1"

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++20 -O3 -fvisibility=hidden -Wall -Wextra"
                arguments "-DANDROID_STL=c++_static", "-DANDROID_PLATFORM=android-29"
                cFlags "-Wl,-z,max-page-size=16384"
            }
        }
    }

    // The runtime archive is already gzip-compressed; avoid AGP recompressing
    // hundreds of megabytes into a byte array during asset packaging.
    androidResources {
        noCompress += ['gz']
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            jniDebuggable true
        }
    }

    externalNativeBuild {
        cmake {
            path "../native/CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'org.apache.commons:commons-compress:1.27.1'
}
